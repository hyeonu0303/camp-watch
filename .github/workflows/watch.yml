name: camp-watch
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: camp-watch
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check availability
        env:
          CAMP_ID: ${{ secrets.CAMP_ID }}
          CAMP_PW: ${{ secrets.CAMP_PW }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 watch.py
      - name: Save state
        if: always()
        run: |
          git config user.name "camp-watch-bot"
          git config user.email "camp-watch-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
